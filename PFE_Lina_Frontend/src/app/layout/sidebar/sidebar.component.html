<aside class="sidebar">
  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo"><mat-icon>local_shipping</mat-icon></div>
    <div class="brand-text">
      <span class="brand-name">SmartDelivery</span>
      <span class="brand-tagline">Fleet Management</span>
    </div>
  </div>

  <!-- Navigation dynamique selon le rôle -->
  <nav class="nav-section">
    <div class="nav-label">Navigation</div>
    @for (item of navItems(); track item.route) {
      <a class="nav-item" [routerLink]="item.route" routerLinkActive="active">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Footer utilisateur -->
  <div class="sidebar-footer">
    <div class="role-badge">{{ auth.role() }}</div>
    <div class="user-row">
      <div class="avatar">{{ (auth.nomComplet() || 'U')[0].toUpperCase() }}</div>
      <div class="user-info">
        <div class="user-name">{{ auth.nomComplet() }}</div>
        <div class="user-role">{{ auth.user()?.email }}</div>
      </div>
      <button class="logout-btn" (click)="auth.logout()" title="Déconnexion">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>
</aside>
